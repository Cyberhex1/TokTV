<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TokTV Remote</title>
<style>
:root{--bg:#0b0b0b;--card:#1a1a1a;--line:#2a2a2a;--text:#f2f2f2;--dim:#9a9a9a;--pink:#fe2c55;--cyan:#25f4ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header b{font-size:20px}.badge{background:var(--pink);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:2px 6px}
#conn{margin-left:auto;font-size:13px;color:var(--dim)}
main{padding:12px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:13px;padding:10px 0 12px}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--text)}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#262626;color:var(--text);border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;flex:1;min-width:70px}
.btn:active{background:#333}.btn.pink{background:var(--pink)}.btn.small{flex:0;padding:10px 12px}
.now{display:flex;gap:12px;align-items:center}
.now img,.item img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#333;flex:none}
.now .t{min-width:0}.now .n{font-weight:700;font-size:18px}.dim{color:var(--dim);font-size:14px}
.cyan{color:var(--cyan)}
#chat{height:38vh;overflow-y:auto;background:#111;border-radius:12px;padding:8px 10px;margin:10px 0;font-size:15px}
#chat div{padding:2px 0}#chat b{margin-right:6px}
.compose{display:flex;gap:8px}
.compose input,.search input{flex:1;background:#1f1f1f;border:2px solid #333;border-radius:12px;color:var(--text);padding:12px;font-size:16px;min-width:0}
.compose input:focus,.search input:focus{outline:0;border-color:var(--pink)}
.react{display:flex;gap:6px;margin-top:8px}.react button{flex:1;font-size:22px;padding:8px 0}
h3{margin:18px 0 8px;font-size:17px}
.item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--card);margin-bottom:8px}
.item .t{min-width:0;flex:1}.item .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off{opacity:.5}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:8px auto}
.pad button{aspect-ratio:1/1;font-size:26px;border-radius:50%}
.pad .ok{background:var(--pink)}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gifts button{background:#262626;border:0;color:var(--text);border-radius:12px;padding:10px 4px;font-size:14px}
.gifts img{width:40px;height:40px;display:block;margin:0 auto 4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.empty{color:var(--dim);text-align:center;padding:30px 0}
#pair{display:none;text-align:center;padding:40px 20px}
</style>
</head>
<body>
<header><b>TokTV</b><span class="badge">REMOTE</span><span id="conn">connecting…</span></header>

<div id="pair"><h2>Pair with your TV</h2><p class="dim">On the TV: TokTV → ≡ → Phone remote. Scan the QR code, or type the 6-digit code shown there.</p>
  <div class="compose" style="max-width:300px;margin:16px auto"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123 456" enterkeyhint="go"><button class="btn small pink" id="pairgo">Pair</button></div>
  <p class="dim" id="pairmsg"></p></div>

<main id="app">
  <section class="tab on" id="t-watch">
    <div class="card" id="nowcard"><div class="empty">Nothing playing. Pick a LIVE in the LIVEs tab.</div></div>
    <div id="livectl" style="display:none">
      <div class="row">
        <button class="btn pink" id="like">❤️ Like</button>
        <button class="btn" id="follow">＋ Follow</button>
        <button class="btn" id="pin">★ Pin</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn small" id="prev">▲ Prev</button>
        <button class="btn small" id="next">▼ Next</button>
        <button class="btn" id="chattog">💬 Chat on TV</button>
        <button class="btn" id="giftbtn">🎁 Gifts</button>
      </div>
      <div id="giftbox" style="display:none"><div class="gifts" id="gifts"></div></div>
      <div id="chat"></div>
      <div class="compose"><input id="msg" placeholder="Say something…" maxlength="150" enterkeyhint="send"><button class="btn small pink" id="send">Send</button></div>
      <div class="react">
        <button class="btn" data-r="👋">👋</button><button class="btn" data-r="😂">😂</button><button class="btn" data-r="🔥">🔥</button>
        <button class="btn" data-r="👏">👏</button><button class="btn" data-r="❤️">❤️</button><button class="btn" data-r="hi!" style="font-size:17px">hi!</button>
      </div>
    </div>
  </section>

  <section class="tab" id="t-lives"><div id="lives"><div class="empty">Loading…</div></div></section>

  <section class="tab" id="t-search">
    <div class="compose search"><input id="q" placeholder="Name, @username or topic" enterkeyhint="search"><button class="btn small pink" id="go">Search</button></div>
    <p class="dim">Results also show on the TV.</p>
    <div id="results"></div>
  </section>

  <section class="tab" id="t-remote">
    <div class="pad">
      <span></span><button class="btn" data-k="up">▲</button><span></span>
      <button class="btn" data-k="left">◀</button><button class="btn ok" data-k="ok">OK</button><button class="btn" data-k="right">▶</button>
      <span></span><button class="btn" data-k="down">▼</button><span></span>
    </div>
    <div class="row"><button class="btn" data-k="back">↩ Back</button><button class="btn" data-k="menu">≡ Menu</button><button class="btn" id="homebtn">⌂ LIVE list</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-k="rew">⏪</button><button class="btn" data-k="playpause">⏯</button><button class="btn" data-k="ff">⏩</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-v="down">🔉</button><button class="btn" data-v="mute">🔇</button><button class="btn" data-v="up">🔊</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="mouse">🖱 Free mouse</button><button class="btn" id="quality">⚙ Quality</button></div>
  </section>
</main>

<nav>
  <button class="on" data-t="watch"><span>📺</span>Watching</button>
  <button data-t="lives"><span>🔴</span>LIVEs</button>
  <button data-t="search"><span>🔍</span>Search</button>
  <button data-t="remote"><span>🎮</span>Remote</button>
</nav>
<div id="toast"></div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var key = null;
  try { key = localStorage.getItem('tvkey'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var started = false;
  function showPair(msg) { $('pair').style.display = 'block'; $('app').style.display = 'none'; $('pairmsg').textContent = msg || ''; }
  function pair(code) {
    code = String(code || '').replace(/\D/g, '');
    if (code.length !== 6) { showPair('The code has 6 digits.'); return; }
    $('pairmsg').textContent = 'Pairing…';
    fetch('/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { showPair(j.error || 'That code didn\'t work.'); return; }
        key = j.key;
        try { localStorage.setItem('tvkey', key); } catch (e) {}
        $('pair').style.display = 'none'; $('app').style.display = 'block';
        start();
      })
      .catch(function () { showPair('Can\'t reach the TV. Is the phone on the same Wi-Fi?'); });
  }
  $('pairgo').onclick = function () { pair($('code').value); };
  $('code').onkeydown = function (e) { if (e.key === 'Enter') pair($('code').value); };
  var state = {}, chatSince = 0, liveUser = null;

  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, 2200); }
  function api(path, body) {
    return fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'X-Key': key || '', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 403) { try { localStorage.removeItem('tvkey'); } catch (e) {} key = null; showPair('This phone was unpaired. Pair it again.'); throw new Error('not paired'); }
        return r.json();
      })
      .then(function (j) { $('conn').textContent = '● connected'; $('conn').style.color = '#25f4ee'; return j; })
      .catch(function (e) { $('conn').textContent = '○ TV not reachable'; $('conn').style.color = '#9a9a9a'; throw e; });
  }
  function act(path, body, okText) {
    return api(path, body || {}).then(function (j) { if (j.ok === false) toast(j.error || 'Didn\'t work'); else if (okText) toast(okText); return j; }).catch(function () {});
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n(x) { return x >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : String(x || 0); }

  // Tabs
  document.querySelectorAll('nav button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.id === 't-' + b.dataset.t); });
      if (b.dataset.t === 'lives') loadLives();
    };
  });

  // Now watching
  function renderNow() {
    var l = state.live;
    if (!l) {
      $('nowcard').innerHTML = '<div class="empty">' + (state.screen === 'list' ? 'On the LIVE list.' : 'Nothing playing.') + ' Pick a LIVE in the LIVEs tab.</div>';
      $('livectl').style.display = 'none';
      return;
    }
    $('livectl').style.display = 'block';
    $('nowcard').innerHTML = '<div class="now">' + (l.avatar ? '<img src="' + esc(l.avatar) + '">' : '<img>') +
      '<div class="t"><div class="n">' + esc(l.nick || l.user) + '</div><div class="dim">@' + esc(l.user) +
      (l.viewers ? ' · <span class="cyan">' + n(l.viewers) + ' watching</span>' : '') + '</div>' +
      (l.title ? '<div class="dim">' + esc(l.title) + '</div>' : '') + '</div></div>';
    $('pin').textContent = l.pinned ? '★ Unpin' : '☆ Pin';
    $('chattog').textContent = l.chat ? '💬 Hide chat on TV' : '💬 Show chat on TV';
    if (liveUser !== l.user) { liveUser = l.user; $('chat').innerHTML = ''; chatSince = 0; $('giftbox').style.display = 'none'; }
  }
  function pollState() { api('state').then(function (s) { state = s; renderNow(); }).catch(function () {}); }
  function pollChat() {
    if (!state.live) return;
    api('chat?since=' + chatSince).then(function (j) {
      var box = $('chat'), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
      (j.lines || []).forEach(function (x) {
        chatSince = Math.max(chatSince, x.t || 0);
        var d = document.createElement('div');
        d.innerHTML = '<b style="color:' + color(x.n) + '">' + esc(x.n) + '</b>' + esc(x.k && x.k.indexOf('gift') >= 0 ? '🎁 ' + x.m : x.m);
        d.onclick = function () { $('msg').value = '@' + x.n + ' '; $('msg').focus(); };
        box.appendChild(d);
      });
      while (box.children.length > 120) box.removeChild(box.firstChild);
      if (atEnd) box.scrollTop = box.scrollHeight;
      if (!j.open && !box.children.length) box.innerHTML = '<div class="dim">Chat is hidden on the TV. Tap "Show chat on TV" to see it here and send messages.</div>';
    }).catch(function () {});
  }
  var colors = ['#25F4EE', '#FFC94D', '#8AB4FF', '#B6F36A', '#FF9AC2', '#FFA45C', '#C7A6FF'];
  function color(s) { var h = 0; s = s || ''; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return colors[Math.abs(h) % colors.length]; }

  function sendText(t) {
    t = (t || '').trim(); if (!t) return;
    act('send', { text: t }, 'Sent').then(function (j) { if (j && j.ok !== false) $('msg').value = ''; });
  }
  $('send').onclick = function () { sendText($('msg').value); };
  $('msg').onkeydown = function (e) { if (e.key === 'Enter') sendText($('msg').value); };
  document.querySelectorAll('[data-r]').forEach(function (b) {
    b.onclick = function () { if (b.dataset.r === '❤️') act('like', {}, '❤️'); else sendText(b.dataset.r); };
  });

  // Like: tap = one, hold = several
  var likeTimer = null;
  function likeOnce() { act('like', {}, null); }
  $('like').onclick = function () { likeOnce(); toast('❤️'); };
  $('like').addEventListener('touchstart', function () { likeTimer = setInterval(likeOnce, 450); }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (ev) { $('like').addEventListener(ev, function () { clearInterval(likeTimer); }); });

  $('follow').onclick = function () { act('follow', {}).then(function (j) { if (j && j.already) toast('Already following'); else if (j && j.ok) toast('Followed'); }); };
  $('pin').onclick = function () { act('pin', {}).then(function (j) { if (j && j.ok) toast(j.pinned ? 'Pinned' : 'Unpinned'); pollState(); }); };
  $('prev').onclick = function () { act('prev'); };
  $('next').onclick = function () { act('next'); };
  $('chattog').onclick = function () { act('chat_toggle').then(pollState); };

  // Gifts: always confirmed on the phone before anything is spent
  $('giftbtn').onclick = function () {
    var box = $('giftbox');
    if (box.style.display === 'block') { box.style.display = 'none'; return; }
    box.style.display = 'block'; $('gifts').innerHTML = '<div class="dim">Loading gifts…</div>';
    api('gifts').then(function (j) {
      if (!j.ok) { $('gifts').innerHTML = '<div class="dim">' + esc(j.error || 'No gifts') + '</div>'; return; }
      $('gifts').innerHTML = '';
      (j.gifts || []).forEach(function (g) {
        var b = document.createElement('button');
        b.innerHTML = (g.icon ? '<img src="' + esc(g.icon) + '">' : '') + esc(g.name) + '<br><span class="dim">🪙 ' + g.coins + '</span>';
        b.onclick = function () {
          var who = state.live ? '@' + state.live.user : 'this LIVE';
          if (!confirm('Send ' + g.name + ' to ' + who + '?\nThis spends ' + g.coins + ' coin' + (g.coins === 1 ? '' : 's') + ' from your TikTok balance.')) return;
          act('gift', { name: g.name }, 'Sent ' + g.name);
        };
        $('gifts').appendChild(b);
      });
    }).catch(function () {});
  };

  // LIVE lists
  function item(r) {
    var d = document.createElement('div'); d.className = 'item' + (r.live === false ? ' off' : '');
    d.innerHTML = (r.avatar ? '<img src="' + esc(r.avatar) + '">' : '<img>') + '<div class="t"><div class="n">' + (r.pinned ? '★ ' : '') + esc(r.nick || r.user) +
      '</div><div class="dim s">@' + esc(r.user) + (r.live === false ? (r.followers ? ' · ' + n(r.followers) + ' followers' : ' · not LIVE') : (r.viewers ? ' · <span class="cyan">' + n(r.viewers) + ' watching</span>' : ' · LIVE')) +
      '</div>' + (r.title ? '<div class="dim s">' + esc(r.title) + '</div>' : '') + '</div>';
    d.onclick = function () {
      if (r.live === false) { if (confirm('@' + r.user + ' isn\'t LIVE. ' + (r.pinned ? 'Unpin' : 'Pin') + ' them?')) act('pin', { user: r.user }, null).then(loadLives); return; }
      act('watch', { user: r.user }, 'Playing on the TV');
      document.querySelector('nav button[data-t=watch]').click();
    };
    return d;
  }
  function loadLives() {
    api('lives').then(function (j) {
      var box = $('lives'); box.innerHTML = '';
      [['★ Pinned', j.pinned], ['Following · LIVE now', j.following], ['Recommended', j.recommended], ['🎮 Gaming', j.gaming]].forEach(function (s) {
        if (!s[1] || !s[1].length) return;
        var h = document.createElement('h3'); h.textContent = s[0] + ' (' + s[1].length + ')'; box.appendChild(h);
        s[1].forEach(function (r) { box.appendChild(item(r)); });
      });
      if (!box.children.length) box.innerHTML = '<div class="empty">No LIVEs loaded yet. Open TokTV on the TV.</div>';
    }).catch(function () {});
  }

  // Search
  var searchTimer = null;
  function doSearch() {
    var q = $('q').value.trim(); if (!q) return;
    $('q').blur();
    $('results').innerHTML = '<div class="empty">Searching TikTok…</div>';
    act('search', { q: q }).then(function () {
      clearInterval(searchTimer); var tries = 0;
      searchTimer = setInterval(function () {
        if (++tries > 30) clearInterval(searchTimer);
        api('results').then(function (j) {
          var box = $('results'); box.innerHTML = '';
          if (j.live && j.live.length) { var h = document.createElement('h3'); h.textContent = 'LIVE now'; box.appendChild(h); j.live.forEach(function (r) { box.appendChild(item(r)); }); }
          if (j.accounts && j.accounts.length) { var h2 = document.createElement('h3'); h2.textContent = 'Accounts'; box.appendChild(h2); j.accounts.forEach(function (r) { box.appendChild(item(r)); }); }
          if (!j.searching) { clearInterval(searchTimer); if (!box.children.length) box.innerHTML = '<div class="empty">Nothing found.</div>'; }
          else if (!box.children.length) box.innerHTML = '<div class="empty">Searching TikTok…</div>';
        }).catch(function () {});
      }, 1500);
    });
  }
  $('go').onclick = doSearch;
  $('q').onkeydown = function (e) { if (e.key === 'Enter') doSearch(); };

  // Remote buttons
  document.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { act('key', { key: b.dataset.k }); if (navigator.vibrate) navigator.vibrate(15); }; });
  document.querySelectorAll('[data-v]').forEach(function (b) { b.onclick = function () { act('volume', { dir: b.dataset.v }); }; });
  $('homebtn').onclick = function () { act('home'); };
  $('mouse').onclick = function () { act('mouse', {}, 'Free mouse toggled'); };
  $('quality').onclick = function () { act('quality', {}, 'Quality changed'); };

  function start() {
    if (started) return; started = true;
    pollState(); setInterval(function () { if (key) pollState(); }, 2500);
    setInterval(function () { if (key) pollChat(); }, 1500);
  }
  var qc = qs.get('c');
  if (qc) history.replaceState(null, '', location.pathname);   // the code is one-time: don't keep it in the address
  if (qc && !key) pair(qc);
  else if (!key) showPair();
  else start();
})();
</script>
</body>
</html>
